<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonezegei Linux — tty1</title>
  <style>
    /* ── HARD RESET ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── SCREEN ─────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100vh;
      overflow: hidden;             /* NO scrollbar, ever */
      background: #000;
      color: #c8c8c8;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      line-height: 1.45;
    }

    /* CRT scanlines */
    body::before {
      content: "";
      pointer-events: none;
      position: fixed; inset: 0; z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 3px
      );
    }

    /* ── TTY WRAPPER ────────────────────────────────────────── */
    #tty {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4px 8px;
    }

    /* ── LOG AREA (FIFO viewport) ───────────────────────────── */
    #log {
      flex: 1 1 auto;
      overflow: hidden;             /* lines fall off the top */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;   /* content anchored to bottom */
    }

    .line {
      display: block;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 1.45em;
    }

    /* ── INPUT ROW (sticky bottom) ───────────────────────────── */
    #input-row {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      padding-top: 1px;
    }

    #prompt-label {
      white-space: nowrap;
      flex-shrink: 0;
    }

    #cmd-input {
      flex: 1 1 auto;
      background: transparent;
      border: none;
      outline: none;
      color: #c8c8c8;
      font: inherit;
      caret-color: #c8c8c8;
      padding: 0;
      margin: 0;
    }

    /* ── COLOURS ─────────────────────────────────────────────── */
    .k  { color: #5f8700; }   /* kernel timestamp dim */
    .kb { color: #afd700; }   /* kernel body */
    .sd { color: #5f87af; }   /* systemd dim */
    .sb { color: #87afff; }   /* systemd body */
    .ok { color: #00af5f; }   /* green OK */
    .er { color: #d70000; }   /* red fail */
    .wn { color: #d78700; }   /* amber warn */
    .in { color: #00afaf; }   /* cyan info */
    .br { color: #eeeeee; }   /* bright white */
    .pu { color: #875fd7; }   /* purple (nix store) */
    .gr { color: #767676; }   /* grey muted */

    /* login banner */
    .banner { color: #00afaf; font-weight: bold; }
    .user   { color: #afd700; }
    .host   { color: #00afaf; }
    .path   { color: #0087ff; }
    .dollar { color: #eeeeee; }
  </style>
</head>
<body>
<div id="tty">
  <div id="log"></div>
  <div id="input-row" style="display:none;">
    <span id="prompt-label"></span>
    <input id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>

/* How many lines to keep visible at once (FIFO trim) */
const MAX_LINES = Math.floor((window.innerHeight - 28) / (13 * 1.45)) + 4;

/* Push a rendered HTML line into the log area, trim oldest if needed */
function push(html) {
  const el = document.createElement('span');
  el.className = 'line';
  el.innerHTML = html;
  logEl.appendChild(el);
  while (logEl.children.length > MAX_LINES) {
    logEl.removeChild(logEl.firstChild);
  }
}

  cls = cls || 'sb';

function enqueue(lines, baseDelay, jitter) {
  lines.forEach((html, i) => {
    queue.push({ html, delay: baseDelay + Math.random() * jitter });
  });
}

function runQueue(onDone) {
  if (queue.length === 0) { if (onDone) onDone(); return; }
  const item = queue.shift();
  push(item.html);
  setTimeout(() => runQueue(onDone), item.delay);
}

/* ════════════════════════════════════════════════════════════════
   LOGIN BANNER + SHELL PROMPT
   ════════════════════════════════════════════════════════════════ */
function showLoginBanner() {
  push('');
  push(`<span class="banner">Bonezegei Linux</span> <span class="gr">tty1</span>`);
  push('');

  setTimeout(() => {
    push(`<span class="br">mirkolouis login: </span><span class="user">mirkolouis</span>`);
    setTimeout(() => {
      push(`<span class="gr">Last login: Sun Aug 24 06:38:20 2026 on tty1</span>`);
      setTimeout(() => {
        push('');
        /* run BSL server "boot" */
        const bslQ = BSL_LINES.map(h => ({ html: h, delay: 80 }));
        queue = bslQ;
        runQueue(() => {
          setTimeout(showShell, 300);
        });
      }, 400);
    }, 600);
  }, 500);
}

function showShell() {
  push('');
  /* Build prompt HTML for the log line (already-entered) */
  const promptHtml =
    `<span class="user">mirkolouis</span><span class="gr">@</span><span class="host">bonezegei-linux</span><span class="gr">:</span><span class="path">~</span><span class="dollar">$</span> ` +
    `<span class="wn">bonezegei server.bzg</span>`;
  push(promptHtml);

  /* Now show the interactive prompt */
  showPrompt();
}

function showPrompt() {
  prompt.innerHTML =
    `<span class="user">mirkolouis</span><span class="gr">@</span><span class="host">bonezegei-linux</span><span class="gr">:</span><span class="path">~</span><span class="dollar">$</span>&nbsp;`;
  rowEl.style.display = 'flex';
  input.value = '';
  input.focus();
}

/* ════════════════════════════════════════════════════════════════
   COMMAND HANDLER
   ════════════════════════════════════════════════════════════════ */
input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();

  const cmd = input.value.trim().toLowerCase();

  /* Echo the command typed into the log */
  const echoHtml =
    `<span class="user">mirkolouis</span><span class="gr">@</span><span class="host">bonezegei-linux</span><span class="gr">:</span><span class="path">~</span><span class="dollar">$</span> ` +
    escHtml(input.value);
  push(echoHtml);

  rowEl.style.display = 'none';

  if (cmd === 'get /') {
    /* Show a fake HTTP exchange then reload */
    push(`<span class="gr">&gt; GET / HTTP/1.1</span>`);
    push(`<span class="gr">&gt; Host: localhost:8080</span>`);
    push(`<span class="gr">&gt;</span>`);
    push(`<span class="ok">&lt; HTTP/1.1 200 OK</span>`);
    push(`<span class="gr">&lt; Server: BSL-Static-Server/1.0</span>`);
    push(`<span class="gr">&lt; Content-Type: text/html; charset=utf-8</span>`);
    push(`<span class="gr">&lt; Connection: close</span>`);
    push(`<span class="gr">&lt;</span>`);
    push(`<span class="in">Reloading page...</span>`);
    setTimeout(() => window.location.reload(), 800);
  } else if (cmd === '') {
    showPrompt();
  } else {
    push(`<span class="er">bash: ${escHtml(input.value)}: command not found</span>`);
    push(`<span class="gr">(Only recognized command: <span class="wn">get /</span>)</span>`);
    setTimeout(showPrompt, 120);
  }
});

/* keep focus on input whenever user clicks anywhere */
document.addEventListener('click', () => { if (rowEl.style.display !== 'none') input.focus(); });

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ════════════════════════════════════════════════════════════════
   BOOT SEQUENCE KICKOFF
   ════════════════════════════════════════════════════════════════ */
(function boot() {
  /* All kernel lines burst-fire fast (real kernel dumps instantly) */
  enqueue(KERNEL_LINES, 18, 8);
  /* pause, then systemd lines at a moderate pace */
  queue.push({ html: '', delay: 80 });
  enqueue(SD_LINES, 55, 30);

  runQueue(() => {
    setTimeout(showLoginBanner, 300);
  });
})();
</script>
